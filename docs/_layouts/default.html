<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adventures in Deep Space: {{ page.title }}</title>
    <link rel="stylesheet" href="assets/common.css?version=8">
    <script type="text/javascript" src="assets/common.js?version=4"></script>
    {% include mathjax_support.html %}
    {% assign no_equation_hilight = page.no_equation_hilight | default: false %}
    {% if no_equation_hilight %}
    <style>
      mjx-container {
	  color: inherit;
      }
    </style>
    {% endif %}
  </head>
  <body class="article">
    <center>
      <h1>{{ page.title }}</h1>
      {% if page.author %}
      <div style="float: right; margin-right: 100px;">by <b>{{ page.author }}</b></div><br />
      {% endif %}
    </center>
    <br />
    <div class="main_content">
      {{ content }}
    </div>
    
  </body>
</html>
