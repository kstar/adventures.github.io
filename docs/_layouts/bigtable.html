<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adventures in Deep Space: {{ page.title }}</title>
    <link rel="stylesheet" href="assets/common.css?version=8">
    <script type="text/javascript" src="assets/common.js?version=4"></script>
    <script type="text/javascript">document.disableCSVMaker = true; document.disableDSO = true;</script>
    {% if page.open_new_page %}
    <base target="_blank" />
    {% endif %}
    <style>
      table {
	  margin-left: auto;
	  margin-right: auto;
      }
      h2 {
	  scroll-margin-top: 30px;
      }
      a.top {
	  text-decoration: none;
	  display: flex;
	  justify-content: right;
	  margin-right: 30px;
	  font-size: 16px;
      }
    </style>
  </head>
  <body>
    <center>
      <h1>{{ page.title }}</h1>
      <div style="float: right; margin-right: 100px;">by <b>{{ page.author }}</b></div><br />
    </center>
    <br />
    <div class="main_content">
      {{ content }}
    </div>
    
  </body>
</html>
